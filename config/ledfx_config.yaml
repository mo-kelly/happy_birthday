# Grundkonfiguration für LedFx.
# Wird nach ~/.ledfx/config.yaml kopiert (bzw. in das von install.sh
# angelegte LedFx-Home-Verzeichnis), dient als Startpunkt und kann danach
# vollständig über die Weboberfläche (http://<pi-ip>:8888) angepasst werden.

audio:
  # ALSA-Loopback-Capture-Device, das vom Tee in asound.conf gespeist wird
  device_index: null
  device_name: "hw:Loopback,1,0"
  sample_rate: 44100
  min_volume: 0.2

devices:
  - id: led-strip
    type: wled
    config:
      name: "LED Streifen (GPIO18)"
      ip_address: "127.0.0.1"
      port: 21324
      pixel_count: 150          # an tatsächliche LED-Anzahl anpassen
      refresh_rate: 60
      icon_name: "led-strip"

host_api: ""
port: 8888
